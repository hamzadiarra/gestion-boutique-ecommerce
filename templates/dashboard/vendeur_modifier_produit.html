{% extends "base.html" %}

{% block title %}Modifier {{ produit.nom }} — Espace Vendeur{% endblock %}

{% block content %}
<div class="container mt-4 mb-5 fade-in" style="max-width: 800px;">

    <a href="{% url 'vendeur_liste_produits' %}" class="btn btn-sm btn-outline-secondary mb-4 scroll-animate">
        <i class="bi bi-arrow-left me-1"></i> Retour à la liste
    </a>

    <div class="card glass-card border-0 scroll-animate-scale" style="animation-delay: 0.1s;">
        <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
            <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary" style="width: 48px; height: 48px;">
                    <i class="bi bi-pencil fs-4"></i>
                </div>
                <div>
                    <h4 class="fw-bold mb-0">Modifier le Produit</h4>
                    <p class="text-muted small mb-0 mt-1">Mise à jour de <strong>{{ produit.nom }}</strong>.</p>
                </div>
            </div>
        </div>
        <div class="card-body p-4">

            <form method="POST" action="{% url 'vendeur_modifier_produit' produit.id %}" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <!-- Nom -->
                    <div class="col-12">
                        <label for="nom" class="form-label fw-semibold">Nom du produit <span class="text-danger">*</span></label>
                        <input type="text" name="nom" id="nom" class="form-control form-control-lg fs-6" value="{{ produit.nom }}" required>
                    </div>

                    <!-- Description -->
                    <div class="col-12">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea name="description" id="description" class="form-control" rows="4">{{ produit.description|default:'' }}</textarea>
                    </div>

                    <!-- Catégorie + Marque -->
                    <div class="col-md-6">
                        <label for="categorie" class="form-label fw-semibold">Catégorie <span class="text-danger">*</span></label>
                        <select name="categorie" id="categorie" class="form-select" required>
                            <option value="">-- Choisir une catégorie --</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if cat.id == produit.categorie_id %}selected{% endif %}>{{ cat.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="marque" class="form-label fw-semibold">Marque</label>
                        <input type="text" name="marque" id="marque" class="form-control" value="{{ produit.marque|default:'' }}">
                    </div>

                    <div class="col-12"><hr class="text-muted opacity-25 my-2"></div>

                    <!-- Prix + Prix promo -->
                    <div class="col-md-6">
                        <label for="prix" class="form-label fw-semibold">Prix de vente <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="number" name="prix" id="prix" class="form-control fw-medium" step="0.01" min="0" value="{{ produit.prix }}" required>
                            <span class="input-group-text bg-body-tertiary">FCFA</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="prix_promotion" class="form-label fw-semibold text-success">Prix Promotionnel</label>
                        <div class="input-group">
                            <input type="number" name="prix_promotion" id="prix_promotion" class="form-control border-success-subtle fw-medium" step="0.01" min="0"
                                value="{% if produit.prix_promotion %}{{ produit.prix_promotion }}{% endif %}" placeholder="Optionnel">
                            <span class="input-group-text bg-success-subtle text-success border-success-subtle">FCFA</span>
                        </div>
                    </div>

                    <!-- Stock -->
                    <div class="col-md-6">
                        <label for="stock" class="form-label fw-semibold">Stock disponible <span class="text-danger">*</span></label>
                        <input type="number" name="stock" id="stock" class="form-control" min="0" value="{{ produit.stock }}" required>
                    </div>

                    <!-- Image -->
                    <div class="col-md-6">
                        <label for="image" class="form-label fw-semibold">Image (optionnel)</label>
                        <div class="d-flex align-items-center gap-3 mb-2">
                            {% if produit.image %}
                            <div class="flex-shrink-0">
                                <img src="{{ produit.image.url }}" alt="{{ produit.nom }}" class="rounded shadow-sm" style="width: 56px; height: 56px; object-fit: cover;">
                            </div>
                            {% else %}
                            <div class="flex-shrink-0 bg-body-tertiary rounded d-flex align-items-center justify-content-center text-muted" style="width: 56px; height: 56px;">
                                <i class="bi bi-image"></i>
                            </div>
                            {% endif %}
                            <div class="flex-grow-1">
                                <input type="file" name="image" id="image" class="form-control form-control-sm" accept="image/*">
                            </div>
                        </div>
                    </div>

                    <div class="col-12"><hr class="text-muted opacity-25 my-2"></div>

                    <!-- Options -->
                    <div class="col-12">
                        <div class="d-flex flex-wrap gap-4 p-3 bg-body-tertiary rounded-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="actif" id="actif" {% if produit.actif %}checked{% endif %} role="switch">
                                <label class="form-check-label fw-medium ms-1" for="actif">Produit actif (visible)</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="vedette" id="vedette" {% if produit.vedette %}checked{% endif %} role="switch">
                                <label class="form-check-label fw-medium ms-1 text-warning" for="vedette"><i class="bi bi-star-fill me-1"></i> Mettre en vedette</label>
                            </div>
                        </div>
                    </div>

                    <!-- Boutons -->
                    <div class="col-12 mt-4">
                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{% url 'vendeur_liste_produits' %}" class="btn btn-outline-secondary px-4 py-2">
                                Annuler
                            </a>
                            <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold btn-pulse">
                                <i class="bi bi-check-lg me-2"></i> Enregistrer les modifications
                            </button>
                        </div>
                    </div>
                </div>

            </form>
        </div>
    </div>

</div>
{% endblock %}
