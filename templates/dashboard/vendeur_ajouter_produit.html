{% extends "base.html" %}

{% block title %}Ajouter un Produit — Espace Vendeur{% endblock %}

{% block content %}
<div class="container mt-4 fade-in" style="max-width:760px;">

    <a href="{% url 'vendeur_liste_produits' %}" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left me-1"></i> Retour à la liste
    </a>

    <div class="card shadow border-0">
        <div class="card-header bg-success bg-opacity-10 py-3">
            <h4 class="fw-bold mb-0 text-success"><i class="bi bi-plus-circle me-2"></i>Nouveau Produit</h4>
            <p class="text-muted small mb-0 mt-1">Remplissez le formulaire pour ajouter un nouveau produit à la boutique.</p>
        </div>
        <div class="card-body p-4">

            <form method="POST" action="{% url 'vendeur_ajouter_produit' %}" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-3">
                    <!-- Nom -->
                    <div class="col-12">
                        <label for="nom" class="form-label fw-semibold">Nom du produit <span class="text-danger">*</span></label>
                        <input type="text" name="nom" id="nom" class="form-control" placeholder="Ex: Téléphone Samsung Galaxy A54" required>
                    </div>

                    <!-- Description -->
                    <div class="col-12">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea name="description" id="description" class="form-control" rows="3" placeholder="Description du produit..."></textarea>
                    </div>

                    <!-- Catégorie + Marque -->
                    <div class="col-md-6">
                        <label for="categorie" class="form-label fw-semibold">Catégorie <span class="text-danger">*</span></label>
                        <select name="categorie" id="categorie" class="form-select" required>
                            <option value="">-- Choisir une catégorie --</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="marque" class="form-label fw-semibold">Marque</label>
                        <input type="text" name="marque" id="marque" class="form-control" placeholder="Ex: Samsung, Apple...">
                    </div>

                    <!-- Prix + Prix promo -->
                    <div class="col-md-6">
                        <label for="prix" class="form-label fw-semibold">Prix (FCFA) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="number" name="prix" id="prix" class="form-control" step="0.01" min="0" placeholder="0.00" required>
                            <span class="input-group-text">FCFA</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="prix_promotion" class="form-label fw-semibold">Prix Promo (FCFA)</label>
                        <div class="input-group">
                            <input type="number" name="prix_promotion" id="prix_promotion" class="form-control" step="0.01" min="0" placeholder="Laisser vide si aucune promo">
                            <span class="input-group-text">FCFA</span>
                        </div>
                    </div>

                    <!-- Stock -->
                    <div class="col-md-6">
                        <label for="stock" class="form-label fw-semibold">Stock initial <span class="text-danger">*</span></label>
                        <input type="number" name="stock" id="stock" class="form-control" min="0" value="0" required>
                    </div>

                    <!-- Image -->
                    <div class="col-md-6">
                        <label for="image" class="form-label fw-semibold">Image du produit</label>
                        <input type="file" name="image" id="image" class="form-control" accept="image/*">
                    </div>

                    <!-- Options -->
                    <div class="col-12">
                        <div class="d-flex gap-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="actif" id="actif" checked>
                                <label class="form-check-label fw-semibold" for="actif">Produit actif</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="vedette" id="vedette">
                                <label class="form-check-label fw-semibold" for="vedette">⭐ Produit vedette</label>
                            </div>
                        </div>
                    </div>

                    <!-- Bouton -->
                    <div class="col-12 mt-2">
                        <button type="submit" class="btn btn-success px-5 py-2 fw-semibold shadow-sm">
                            <i class="bi bi-check-circle me-2"></i> Ajouter le Produit
                        </button>
                        <a href="{% url 'vendeur_liste_produits' %}" class="btn btn-outline-secondary ms-2 px-4 py-2">
                            Annuler
                        </a>
                    </div>
                </div>

            </form>
        </div>
    </div>

</div>
{% endblock %}
