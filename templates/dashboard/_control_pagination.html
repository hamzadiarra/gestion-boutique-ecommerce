{% if page_obj.paginator.num_pages > 1 %}<nav class="control-pagination"><span>Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}{% if recherche %}&q={{ recherche|urlencode }}{% endif %}{% if role %}&role={{ role|urlencode }}{% endif %}{% if statut %}&statut={{ statut|urlencode }}{% endif %}"><i class="bi bi-chevron-left"></i></a>{% endif %}{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}{% if recherche %}&q={{ recherche|urlencode }}{% endif %}{% if role %}&role={{ role|urlencode }}{% endif %}{% if statut %}&statut={{ statut|urlencode }}{% endif %}"><i class="bi bi-chevron-right"></i></a>{% endif %}</div></nav>{% endif %}
