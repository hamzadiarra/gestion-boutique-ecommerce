<script>
(() => {
    const input = document.getElementById('image');
    const preview = document.querySelector('[data-image-preview]');
    const placeholder = document.querySelector('[data-image-placeholder]');
    const fileName = document.querySelector('[data-image-name]');
    const clearButton = document.querySelector('[data-image-clear]');
    const zone = document.querySelector('[data-image-zone]');
    if (!input || !preview) return;
    const currentImage = zone ? zone.dataset.currentImage : '';
    input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (!file) return;
        preview.src = URL.createObjectURL(file);
        preview.hidden = false;
        if (placeholder) placeholder.hidden = true;
        if (fileName) fileName.textContent = file.name;
        if (clearButton) clearButton.hidden = false;
    });
    clearButton?.addEventListener('click', () => {
        input.value = '';
        preview.src = currentImage;
        preview.hidden = !currentImage;
        if (placeholder) placeholder.hidden = Boolean(currentImage);
        if (fileName) fileName.textContent = currentImage ? 'Image actuelle' : 'Aucun fichier sélectionné';
        clearButton.hidden = true;
    });
})();
(() => {
    const stock = document.getElementById('stock');
    const status = document.querySelector('[data-stock-status]');
    if (!stock || !status) return;
    const updateStock = () => {
        const value = Number(stock.value);
        status.className = 'seller-stock-status';
        if (Number.isNaN(value) || value <= 0) { status.textContent = 'Rupture'; status.classList.add('is-empty'); }
        else if (value <= 5) { status.textContent = 'Stock faible'; status.classList.add('is-low'); }
        else { status.textContent = 'Disponible'; status.classList.add('is-ok'); }
    };
    stock.addEventListener('input', updateStock);
    updateStock();
})();
</script>
