{% extends "base.html" %}{% load i18n %}

{% block title %}{% trans "Mot de passe modifié — Gestion Boutique" %}{% endblock %}

{% block content %}
<main class="account-page shop-page">
    <div class="container login-page-wrap">
        <div class="row justify-content-center mt-4 mb-5">
            <div class="col-md-8 col-lg-6">
                <div class="text-center mb-4">
                    <div class="login-brand-mark mb-3">
                        <i class="bi bi-check2-circle"></i>
                    </div>
                    <h2 class="fw-bold">{% trans "Mot de passe modifié" %}</h2>
                    <p class="text-muted mb-0">{% trans "Votre mot de passe a été réinitialisé avec succès." %}</p>
                </div>

                <div class="card border-0 shadow-sm login-panel">
                    <div class="card-body p-4 text-center">
                        <a href="{% url 'login' %}" class="btn btn-primary px-4">{% trans "Se connecter" %}</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
