{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width:500px;">

    <div class="card shadow">

        <div class="card-header bg-success text-white text-center">
            <h3>🔐 Connexion</h3>
        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Nom d'utilisateur
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>

                </div>

                <button class="btn btn-success w-100">
                    Se connecter
                </button>

            </form>

            <hr>

            <p class="text-center">

                Vous n'avez pas encore de compte ?

                <a href="{% url 'register' %}">
                    Créer un compte
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
