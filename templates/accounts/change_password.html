{% extends "base.html" %}

{% block title %}Changer le mot de passe — Gestion Boutique{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-orb-3"></div>
    
    <div class="auth-card scroll-animate-scale animate-in" style="animation-delay: 0.1s;">
        <div class="auth-icon" style="background: linear-gradient(135deg, var(--color-warning), #e67e22);">
            <i class="bi bi-shield-lock-fill fs-2 text-white"></i>
        </div>
        
        <h3 class="text-center fw-bold mb-4">Changer le mot de passe</h3>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="form-label">Ancien mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0" style="border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.6);">
                        <i class="bi bi-key"></i>
                    </span>
                    <input type="password" name="old_password" class="form-control border-start-0 ps-0" required autofocus>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label">Nouveau mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0" style="border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.6);">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input type="password" name="new_password1" class="form-control border-start-0 ps-0" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label">Confirmer le nouveau mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0" style="border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.6);">
                        <i class="bi bi-shield-check"></i>
                    </span>
                    <input type="password" name="new_password2" class="form-control border-start-0 ps-0" required>
                </div>
            </div>
            
            <button class="btn btn-warning w-100 mb-3" style="font-weight: 600;">
                Mettre à jour
            </button>
            
        </form>
        
        <div class="auth-divider">Ou</div>
        
        <p class="text-center mb-0">
            <a href="{% url 'profile' %}" class="d-flex align-items-center justify-content-center gap-2 text-warning">
                <i class="bi bi-arrow-left"></i> Retour au profil
            </a>
        </p>
    </div>
</div>
{% endblock %}
